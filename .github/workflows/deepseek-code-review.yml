name: DeepSeek Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths: ['src/**']

concurrency:
  group: deepseek-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    # Forks cannot access the API key.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      result: ${{ steps.deepseek.outputs.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Run only the maintained automation code, never PR-provided scripts.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare task context
        uses: actions/github-script@v7
        with:
          script: |
            const prepare = require('./.github/scripts/ai-context.cjs');
            await prepare({ github, context, core, mode: 'review' });
      - name: Run DeepSeek
        id: deepseek
        uses: actions/github-script@v7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
        with:
          script: |
            const { run } = require('./.github/scripts/deepseek.cjs');
            await run({ core, mode: 'review' });

  publish:
    needs: analyze
    if: needs.analyze.outputs.result != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish DeepSeek result
        uses: actions/github-script@v7
        env:
          AI_RESULT: ${{ needs.analyze.outputs.result }}
        with:
          script: |
            const { publishReview } = require('./.github/scripts/ai-publish.cjs');
            await publishReview({ github, context, core, raw: process.env.AI_RESULT });
