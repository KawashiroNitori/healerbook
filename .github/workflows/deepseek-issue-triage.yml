name: DeepSeek Issue Triage

on:
  issues:
    types: [opened]

jobs:
  gate:
    # Deterministic quota check before any model call; over-quota issues get a fallback label.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check triage quota
        id: gate
        uses: actions/github-script@v7
        env:
          TRIAGE_DAILY_LIMIT_PER_USER: ${{ vars.TRIAGE_DAILY_LIMIT_PER_USER }}
          TRIAGE_DAILY_LIMIT_TOTAL: ${{ vars.TRIAGE_DAILY_LIMIT_TOTAL }}
        with:
          script: |
            const { gate } = require('./.github/scripts/triage-gate.cjs');
            await gate({ github, context, core });

  analyze:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      result: ${{ steps.deepseek.outputs.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Run only the maintained automation code, never PR-provided scripts.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare task context
        uses: actions/github-script@v7
        with:
          script: |
            const prepare = require('./.github/scripts/ai-context.cjs');
            await prepare({ github, context, core, mode: 'triage' });
      - name: Run DeepSeek
        id: deepseek
        uses: actions/github-script@v7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
        with:
          script: |
            const { run } = require('./.github/scripts/deepseek.cjs');
            await run({ core, mode: 'triage' });

  publish:
    needs: analyze
    if: needs.analyze.outputs.result != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish DeepSeek result
        uses: actions/github-script@v7
        env:
          AI_RESULT: ${{ needs.analyze.outputs.result }}
        with:
          script: |
            const { publishTriage } = require('./.github/scripts/ai-publish.cjs');
            await publishTriage({ github, context, raw: process.env.AI_RESULT });
